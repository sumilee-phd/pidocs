# make_site.py가 생성하는 파일. 목차는 scripts/outline.py에서 수정한다.
site_name: AI 파이썬 피지컬컴퓨팅
site_description: 사이버파이 기반 센서 측정·머신러닝·기기 반응 실습서
site_author: 이수미
site_url: https://pidocs.aifusionlab.org/ai-python/
repo_url: https://github.com/sumilee-phd/pidocs
repo_name: sumilee-phd/pidocs
edit_uri: ''
copyright: '© 2026 이수미 · 날씨 자료 <a href="https://open-meteo.com/">Open-Meteo.com</a> (CC BY 4.0)'

theme:
  name: material
  language: ko
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    logo: material/book-open-page-variant

extra_css:
  - https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css
  - assets/css/book.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys

extra:
  homepage: https://pidocs.aifusionlab.org/
  generator: false

plugins:
  - search:
      lang: ko

nav:
  - 시작하며: index.md
  - 1부 센서 데이터와 파이썬 기초:
    - "1장 블록 코딩에서 파이썬으로":
      - ch01/index.md
      - "1.1 피지컬컴퓨팅과 이 과목의 구성": ch01/1-1.md
      - "1.2 블록 코딩 체험": ch01/1-2.md
      - "1.3 Colab 시작": ch01/1-3.md
      - "1.4 변수·자료형·입출력": ch01/1-4.md
      - "1.5 생성형 AI 활용 원칙": ch01/1-5.md
    - "2장 조건·반복·함수":
      - ch02/index.md
      - "2.1 조건문": ch02/2-1.md
      - "2.2 반복문": ch02/2-2.md
